name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*", "stable" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: jobs read only; the build job and the release job ask for more below.
permissions:
  contents: read

# Pushes get one run per commit and are never cancelled, so every commit on main shows
# its own test result (cancelled jobs count as failed checks on GitHub). Pull requests
# still cancel superseded runs. Only the newest commit builds images: see still-latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  lint-and-test:
    name: Lint & Pytest Unit Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the changed-lines check compares with the previous commit

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The exact, hash-checked set the image ships, then the test tools (ARCH-13)
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends restic  # offsite backup restore drill (Batch 6)
          python scripts/check_lock_versions.py

      - name: Run Ruff Lint
        run: ruff check app.py backend tests scripts

      - name: Pyright type check, no file may get worse (OPS-24)
        run: python scripts/pyright_ratchet.py

      - name: Silent except/pass may not grow (ARC-01)
        run: python scripts/silent_except.py

      - name: Run Ruff Format Check
        run: ruff format --check app.py backend tests scripts

      - name: Run Pytest Suite with Coverage
        # OPS-16: coverage may not drop below the floor (raise it as coverage grows)
        # Failing tests are also posted as an annotation, readable without log access
        run: |
          set -o pipefail
          if ! pytest --cov=backend --cov=app --cov-report=xml --cov-fail-under=76 -v -rfE 2>&1 | tee /tmp/zn-unit.log; then
            body=$( (grep -E '^(FAILED|ERROR)|^E  |Required test coverage|Coverage failure' /tmp/zn-unit.log | tail -n 40) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Unit tests::$body"
            exit 1
          fi

      # Coverage slows the search code far more than the yardstick it is measured against, so the
      # search speed gate (AI-16) runs on its own, without coverage
      - name: Search speed
        run: pytest -p no:cov -q -s -rfE tests/test_rag_eval_baseline.py::test_search_stays_fast

      # The overall coverage can hide new untested code: the backend lines a push or pull request
      # changes must themselves be covered by tests (80 %). Pushes that add tests only pass trivially.
      - name: Changed lines are tested (diff coverage)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          diff-cover coverage.xml --compare-branch="$BASE" --fail-under=80 --markdown-report diff-cover.md || status=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "${status:-0}" != 0 ]; then
            echo "::error title=Changed lines are not tested::Fewer than 80% of the backend lines this change touches are covered by tests. See the step summary."
            exit 1
          fi

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest with Coverage)
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: First-load size budget (FE-01)
        run: npm run budget

      - name: Translation lint (FE-13)
        run: npm run lint:i18n

      - name: CSS budget (!important and button classes may only go down)
        run: npm run lint:css

      - name: ESLint (OPS-24)
        run: npm run lint:js

  e2e-integration:
    name: Headless Playwright E2E Integration
    needs: [lint-and-test, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Build frontend static distribution
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python scripts/check_lock_versions.py
          python -m playwright install --with-deps chromium
          # Run Playwright on the patched Node.js from setup-node, not its bundled copy
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"

      - name: Launch Test Server & Run Playwright E2E Suite
        env:
          PORT: "8082"
          WEB_PASSWORD: "e2e-Test-Pass-1"  # not the shared default: that one now gets a generated password
          ZETTNAS_E2E_PASSWORD: "e2e-Test-Pass-1"  # the tests read this (tests/conftest.py resets WEB_PASSWORD)
          DATA_DIR: "${{ github.workspace }}/data"
          # A browsable folder for the explorer and viewer accessibility checks (sample photos go here)
          POOL_PATH: "${{ github.workspace }}/e2e-pool"
          BROWSE_ROOTS: "${{ github.workspace }}/e2e-pool"
          ZETTNAS_E2E_MEDIA_DIR: "${{ github.workspace }}/e2e-pool"
        run: |
          mkdir -p "$ZETTNAS_E2E_MEDIA_DIR"
          annotate() {
            body=$( (echo "$2"; echo '--- server warnings ---'; grep -v 'Auth failed' /tmp/zn-server.log | grep -E 'WARNING|ERROR|CRITICAL|Traceback|Error' | tail -n 25; echo '--- server log ---'; tail -n 15 /tmp/zn-server.log) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::$body"
          }
          # Start background server
          python3 -m backend.main > /tmp/zn-server.log 2>&1 &
          SERVER_PID=$!

          # Poll health endpoint until server is ready
          python3 -c "
          import urllib.request, time
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8082/api/health', timeout=1) as r:
                      if r.status == 200:
                          print('ZettNAS test server is ready and responding on port 8082.')
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Timed out waiting for the test server.')
          " || { annotate 'E2E server' 'Test server did not become healthy'; exit 1; }

          # PERF-10: one idle minute with nobody using the app. Starting more than 10 processes a
          # minute fails the run; wakeups and CPU are warnings (a shared runner is noisy).
          HOST_PROC=/proc python3 scripts/hardware_budgets.py --pid "$SERVER_PID" --scope tree --warmup 30 \
            --seconds 60 --only spawns,wakeups,idle-cpu --strict spawns --show --results /tmp/zn-idle ||
            { annotate 'Idle minute' 'The idle backend started more than 10 processes a minute'; exit 1; }

          # Execute full Playwright E2E Integration Suite; skips count as failures here
          set -o pipefail
          if ! ZETTNAS_E2E_REQUIRED=1 pytest tests/test_e2e_integration.py tests/test_e2e_a11y.py tests/test_e2e_keyboard_german.py tests/test_e2e_journeys.py -v -rfE 2>&1 | tee /tmp/zn-e2e.log; then
            annotate 'E2E tests' "$(grep -E '^(FAILED|ERROR|E  )|Error|assert' /tmp/zn-e2e.log | tail -n 25)"
            exit 1
          fi

          # Shutdown background server cleanly
          kill $SERVER_PID || true

  # After the tests pass: is this commit still the tip of main? If not, a newer commit will
  # build and publish the images, so this one skips the build (skipped, not failed).
  still-latest:
    name: Still the latest commit?
    needs: [lint-and-test, frontend, e2e-integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - id: check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          tip=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "main has moved on to ${tip:0:7}; that commit builds the images." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-push:
    name: Build & Push Multi-Arch GHCR Container (${{ matrix.variant }})
    needs: [lint-and-test, frontend, e2e-integration, still-latest]
    # full: the default image. core: no VMs or LCD renderer, published as -core tags (OPS-11)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: core
            suffix: "-core"
    if: github.event_name == 'push' && needs.still-latest.outputs.latest == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/stable')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # keyless cosign signing (OIDC)
    env:
      DOCKER_CLIENT_TIMEOUT: "120"
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Optimize Runner Network (Disable IPv6 & Configure DNS)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
          sudo mkdir -p /etc/docker
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker logout || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Pre-pull BuildKit with retry
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i to pull BuildKit..."
            docker pull moby/buildkit:buildx-stable-1 && break || sleep 3
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: |
            network=host

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # A version tag publishes :beta and the exact version; .github/workflows/promote.yml
            # moves :latest, :stable and MAJOR.MINOR to it after a 7-day soak (OPS-07)
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,format=short

      # Push under the commit tag only; the public tags are added after the scan and signature.
      # Pushed by digest only: no tag points at it until the smoke test, scan and signing pass (OPS-1)
      - name: Build and push Multi-Arch Docker image (by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # The image that will be published must start and serve the app (OPS-08).
      # It also must answer within 45 s of starting and stay within its download size (PERF-28, 29)
      - name: Smoke-test the built image (amd64, ${{ matrix.variant }})
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          STARTUP_BUDGET_SECS: "45"
          IMAGE_BUDGET_MB: ${{ matrix.variant == 'core' && '340' || '700' }}
        run: sh scripts/smoke_test.sh "$IMAGE" linux/amd64 18082 120

      # arm64 is built and published, so start it too (under QEMU, hence the longer wait).
      # Blocking (OPS-10). The script runs the arm64 manifest by its own digest: Docker refuses
      # a second platform of a digest it already pulled, which made this step fail unseen while
      # it was continue-on-error.
      - name: Smoke-test the built image (arm64, emulated, ${{ matrix.variant }})
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: sh scripts/smoke_test.sh "$IMAGE" linux/arm64 18083 600

      # Release gate (OPS-06): no Critical vulnerability that already has a fix.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The action installs Trivy v0.70.0 unless told otherwise; Dependabot does not bump this
          version: v0.76.1
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # High findings are reported, not blocking, until each is triaged (OPS-13)
      - name: Report High vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # The real update path, end to end: Stable and the two newest releases, each on fresh data
      # with an account and a backup job made through its own API, updated to this build by its
      # own update helper (data must survive), then to an image that can't start (must roll
      # back). Blocking, and run before any tag is published, so a build that breaks updating or
      # rolling back never reaches edge/main (OPS-9, audit batch 1).
      - name: Upgrade and rollback test
        if: matrix.variant == 'full'
        run: |
          NEW="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull -q "$NEW"
          RECENT=$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}" 'v*' \
            | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -2)
          for tag in latest $RECENT; do
            OLD="ghcr.io/${{ github.repository }}:$tag"
            docker pull -q "$OLD" || { echo "no image $OLD, skipped"; continue; }
            echo "### from $tag"
            if ! sh scripts/upgrade_rollback_test.sh "$OLD" "$NEW"; then
              echo "::error title=Upgrade and rollback test::failed from $tag, see the step log"
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature bound to this workflow's identity; nothing to keep secret.
      - name: Sign image digest
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Publish tags for the verified digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # A build that finished after a newer commit landed must not move edge/main back
          moving_ok=1
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tip=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
            [ "$tip" = "${{ github.sha }}" ] || moving_ok=0
          fi
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$moving_ok" = 0 ] && [[ "$tag" != *":sha-"* ]]; then continue; fi
            args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/${{ github.repository }}@${DIGEST}"
          echo "Published ${#args[@]} tag argument(s) for ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify ghcr.io/${{ github.repository }}@${DIGEST} --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/ci\.yml@refs/(heads/main|tags/v[0-9].*)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: GitHub Release & Release Notes
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract Release Notes and Title from CHANGELOG.md
        id: extract_notes
        run: python3 scripts/extract_release_notes.py

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.extract_notes.outputs.title }} (beta)
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          # Beta until the promote workflow publishes it as :latest after the 7-day soak (OPS-07)
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
