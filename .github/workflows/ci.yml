name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*", "stable" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: jobs read only; the build job and the release job ask for more below.
permissions:
  contents: read

# Pushes get one run per commit and are never cancelled, so every commit on main shows
# its own test result (cancelled jobs count as failed checks on GitHub). Pull requests
# still cancel superseded runs. Only the newest commit builds images: see still-latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: "--no-deprecation"
  IMAGE: ghcr.io/fr0styx/kiboto
  # Kiboto rebrand: every image also goes out under the old name, signed there too, so installs made
  # before the rename keep finding their updates (until 2.2; backend/legacy_names.py)
  OLD_IMAGE: ghcr.io/fr0styx/zettnas-toolkit

jobs:
  # The lint, type and supply-chain checks run beside the unit tests, not before them (CI speed-up)
  lint:
    name: Python lint, types & supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          python scripts/check_lock_versions.py

      - name: Known vulnerabilities in the Python dependencies (ARC-32)
        run: pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off

      - name: Secrets in the tree (ARC-32)
        # .gitleaks.toml allows test data; a checked false positive carries a gitleaks:allow comment
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          dir /repo --no-banner --redact --config /repo/.gitleaks.toml

      - name: Run Ruff Lint
        run: ruff check app.py backend tests scripts

      - name: Pyright type check, no file may get worse (OPS-24)
        run: python scripts/pyright_ratchet.py
        env:
          # a fixed Node for pyright: nodeenv cannot read the newest entries in Node's release list
          PYRIGHT_PYTHON_NODE_VERSION: "24.11.1"

      - name: Silent except/pass may not grow (ARC-01)
        run: python scripts/silent_except.py

      - name: Run Ruff Format Check
        run: ruff format --check app.py backend tests scripts

  lint-and-test:
    name: Pytest Unit Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the changed-lines check compares with the previous commit

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Use public DNS when the runner cannot resolve Ubuntu's package servers
        run: |
          # On 11 Nov 2026 the runners' own resolver stopped answering for every ubuntu.com name for
          # hours, so each apt install failed (restic, rclone, Playwright's fonts), mirrors included.
          # Public resolvers still answered.
          if ! getent hosts security.ubuntu.com >/dev/null || ! getent hosts archive.ubuntu.com >/dev/null; then
            echo "::warning::the runner's resolver does not answer for ubuntu.com: switching to public DNS"
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nDomains=~.\n' | sudo tee /etc/systemd/resolved.conf.d/public-dns.conf >/dev/null
            sudo systemctl restart systemd-resolved || true
            sleep 2
            if ! getent hosts archive.ubuntu.com >/dev/null; then
              sudo rm -f /etc/resolv.conf
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
            fi
            getent hosts security.ubuntu.com archive.ubuntu.com || echo "::warning::ubuntu.com still does not resolve"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The exact, hash-checked set the image ships, then the test tools (ARCH-13)
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          # restic: the offsite backup restore drill (Batch 6); rclone: the two-way sync tests, which
          # skip without it (NARC-10)
          # when Ubuntu's package server cannot be reached (it failed three runs in a row on 11 Nov
          # 2026), the same versions come from the projects' own releases, checked against their sums
          if ! (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 restic rclone); then
            echo "::warning::Ubuntu's package server did not answer: restic and rclone come from their releases"
            set -e
            cd /tmp
            curl -fsSL --retry 3 -O https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2
            curl -fsSL --retry 3 -o restic.sums https://github.com/restic/restic/releases/download/v0.18.1/SHA256SUMS
            grep " restic_0.18.1_linux_amd64.bz2$" restic.sums | sha256sum -c -
            bunzip2 -f restic_0.18.1_linux_amd64.bz2 && sudo install -m 755 restic_0.18.1_linux_amd64 /usr/local/bin/restic
            curl -fsSL --retry 3 -O https://github.com/rclone/rclone/releases/download/v1.60.1/rclone-v1.60.1-linux-amd64.zip
            curl -fsSL --retry 3 -o rclone.sums https://github.com/rclone/rclone/releases/download/v1.60.1/SHA256SUMS
            grep " rclone-v1.60.1-linux-amd64.zip$" rclone.sums | sha256sum -c -
            unzip -oq rclone-v1.60.1-linux-amd64.zip && sudo install -m 755 rclone-v1.60.1-linux-amd64/rclone /usr/local/bin/rclone
            cd "$GITHUB_WORKSPACE"
            restic version && rclone version | head -1
          fi
          python scripts/check_lock_versions.py

      - name: Run Pytest Suite with Coverage
        # OPS-16: coverage may not drop below the floor (raise it as coverage grows); the generated
        # response models are left out (pyproject [tool.coverage.run], NARC-4): ~82.4% on 30 Oct 2026
        # Failing tests are also posted as an annotation, readable without log access
        # Four parallel workers (pytest-xdist; the runner has 4 cores): about 2 min instead of 6.
        # Coverage is combined from every worker, so the floor and diff coverage are unchanged.
        run: |
          set -o pipefail
          if ! pytest -n 4 --cov=backend --cov=app --cov-report=xml --cov-fail-under=81 -v -rfEs 2>&1 | tee /tmp/kb-unit.log; then
            body=$( (grep -E '^(FAILED|ERROR)|^E  |Required test coverage|Coverage failure' /tmp/kb-unit.log | tail -n 40) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Unit tests::$body"
            exit 1
          fi

      # Coverage slows the search code far more than the yardstick it is measured against, so the
      # search speed gate (AI-16) runs on its own, without coverage
      - name: Search speed
        run: pytest -p no:cov -q -s -rfE tests/test_rag_eval_baseline.py::test_search_stays_fast

      # The overall coverage can hide new untested code: the backend lines a push or pull request
      # changes must themselves be covered by tests (80 %). Pushes that add tests only pass trivially.
      - name: Changed lines are tested (diff coverage)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          diff-cover coverage.xml --compare-branch="$BASE" --fail-under=80 --format markdown:diff-cover.md || status=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "${status:-0}" != 0 ]; then
            echo "::error title=Changed lines are not tested::Fewer than 80% of the backend lines this change touches are covered by tests. See the step summary."
            exit 1
          fi

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the changed-lines check compares with the previous commit

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Known vulnerabilities in the npm dependencies (ARC-32)
        run: npm audit --audit-level=high

      - name: Run Frontend Tests (Vitest with Coverage)
        run: npm run test:coverage

      # The frontend lines a push or pull request changes are covered by tests too (NARC-10), like
      # the backend's 80 % check; 60 % to start, as the frontend's floor is lower.
      - name: Changed frontend lines are tested (diff coverage)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          pipx run --spec diff-cover==10.6.0 diff-cover coverage/lcov.info --compare-branch="$BASE" --fail-under=60 \
            --include 'frontend/src/*.js' 'frontend/src/components/*.js' 'frontend/src/components/**/*.js' \
            --exclude 'frontend/src/__tests__/*' 'frontend/src/locales/*' \
            --format markdown:diff-cover-js.md || status=$?
          cat diff-cover-js.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "${status:-0}" != 0 ]; then
            echo "::error title=Changed frontend lines are not tested::Fewer than 60% of the frontend lines this change touches are covered by tests. See the step summary."
            exit 1
          fi

      - name: Build frontend
        run: npm run build

      - name: First-load size budget (FE-01)
        run: npm run budget

      - name: Translation lint (FE-13)
        run: npm run lint:i18n

      - name: Type errors may only go down, per file (ARC-31)
        run: npm run lint:types

      - name: CSS budget (!important and button classes may only go down)
        run: npm run lint:css

      - name: ESLint (OPS-24)
        run: npm run lint:js

  # Starts at once, beside the unit tests, in two halves that run side by side (CI speed-up,
  # 12 Nov 2026). Nothing is published until every test job has passed (publish, below).
  e2e-integration:
    name: Headless Playwright E2E Integration (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1 of 2"
            tests: tests/test_e2e_journeys.py
            idle: false
          - shard: "2 of 2"
            tests: tests/test_e2e_integration.py tests/test_e2e_a11y.py tests/test_e2e_keyboard_german.py
            idle: false
          # the idle minute (PERF-10, 90 s) beside the two halves, on the same server setup
          - shard: "idle minute"
            tests: ""
            idle: true
    runs-on: ubuntu-latest
    timeout-minutes: 25  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Build frontend static distribution
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Use public DNS when the runner cannot resolve Ubuntu's package servers
        run: |
          # On 11 Nov 2026 the runners' own resolver stopped answering for every ubuntu.com name for
          # hours, so each apt install failed (restic, rclone, Playwright's fonts), mirrors included.
          # Public resolvers still answered.
          if ! getent hosts security.ubuntu.com >/dev/null || ! getent hosts archive.ubuntu.com >/dev/null; then
            echo "::warning::the runner's resolver does not answer for ubuntu.com: switching to public DNS"
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nDomains=~.\n' | sudo tee /etc/systemd/resolved.conf.d/public-dns.conf >/dev/null
            sudo systemctl restart systemd-resolved || true
            sleep 2
            if ! getent hosts archive.ubuntu.com >/dev/null; then
              sudo rm -f /etc/resolv.conf
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
            fi
            getent hosts security.ubuntu.com archive.ubuntu.com || echo "::warning::ubuntu.com still does not resolve"
          fi

      # The browser download is kept between runs, keyed by the locked Playwright version; the
      # system packages are still installed every run (they live outside the cache)
      - name: Cache the Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.lock') }}

      - name: Install Python dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          python scripts/check_lock_versions.py
          python -m playwright install --with-deps chromium || {
            echo "::warning::Playwright's system packages did not install: the browser alone (the runner image carries its libraries)"
            python -m playwright install chromium
          }
          # Run Playwright on the patched Node.js from setup-node, not its bundled copy
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"

      - name: Launch Test Server & Run Playwright E2E Suite
        env:
          PORT: "8082"
          WEB_PASSWORD: "e2e-Test-Pass-1"  # not the shared default: that one now gets a generated password
          KIBOTO_E2E_PASSWORD: "e2e-Test-Pass-1"  # the tests read this (tests/conftest.py resets WEB_PASSWORD)
          DATA_DIR: "${{ github.workspace }}/data"
          # A browsable folder for the explorer and viewer accessibility checks (sample photos go here)
          # outside the checkout: the folder that holds the data folder and a compose file is the
          # install folder, which Kiboto hides from every file feature
          POOL_PATH: "${{ runner.temp }}/e2e-pool"
          BROWSE_ROOTS: "${{ runner.temp }}/e2e-pool"
          KIBOTO_E2E_MEDIA_DIR: "${{ runner.temp }}/e2e-pool"
        run: |
          mkdir -p "$KIBOTO_E2E_MEDIA_DIR"
          annotate() {
            body=$( (echo "$2"; echo '--- server warnings ---'; grep -v 'Auth failed' /tmp/kb-server.log | grep -E 'WARNING|ERROR|CRITICAL|Traceback|Error' | tail -n 25; echo '--- server log ---'; tail -n 15 /tmp/kb-server.log) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::$body"
          }
          # Start background server
          python3 -m backend.main > /tmp/kb-server.log 2>&1 &
          SERVER_PID=$!

          # Poll health endpoint until server is ready
          python3 -c "
          import urllib.request, time
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8082/api/health', timeout=1) as r:
                      if r.status == 200:
                          print('Kiboto test server is ready and responding on port 8082.')
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Timed out waiting for the test server.')
          " || { annotate 'E2E server' 'Test server did not become healthy'; exit 1; }

          # PERF-10: one idle minute with nobody using the app. Starting more than 10 processes a
          # minute fails the run; wakeups and CPU are warnings (a shared runner is noisy).
          # Its own matrix entry (matrix.idle), on a server no test has touched.
          if [ "${{ matrix.idle }}" = "true" ]; then
            HOST_PROC=/proc python3 scripts/hardware_budgets.py --pid "$SERVER_PID" --scope tree --warmup 30 \
              --seconds 60 --only spawns,wakeups,idle-cpu --strict spawns --show --results /tmp/kb-idle ||
              { annotate 'Idle minute' 'The idle backend started more than 10 processes a minute'; exit 1; }
          fi

          # This half of the Playwright E2E suite; skips count as failures here
          set -o pipefail
          if [ -z "${{ matrix.tests }}" ]; then kill $SERVER_PID || true; exit 0; fi
          # shellcheck disable=SC2086  # matrix.tests is a list of files
          if ! KIBOTO_E2E_REQUIRED=1 pytest ${{ matrix.tests }} -v -rfE 2>&1 | tee /tmp/kb-e2e.log; then
            annotate 'E2E tests' "$(grep -E '^(FAILED|ERROR|E  )|Error|assert' /tmp/kb-e2e.log | tail -n 25)"
            exit 1
          fi

          # Shutdown background server cleanly
          kill $SERVER_PID || true

  # After the tests pass: is this commit still the tip of main? If not, a newer commit will
  # publish the images, so this one skips publishing (skipped, not failed).
  still-latest:
    name: Still the latest commit?
    needs: [lint, lint-and-test, frontend, e2e-integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    outputs:
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - id: check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          tip=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "main has moved on to ${tip:0:7}; that commit publishes the images." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The images are built and checked while the tests run (CI speed-up, 12 Nov 2026): build-image,
  # then check-image (amd64 start, Trivy), update-test and smoke-arm64 (a native arm64 runner)
  # side by side. Nothing is tagged or signed until all of those and every test job have passed
  # (publish). An untagged digest of a build that failed stays unreachable: no tag points at it.
  build-image:
    name: Build multi-arch image (${{ matrix.variant }})
    # full: the default image. core: no VMs or LCD renderer, published as -core tags (OPS-11)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: core
            suffix: "-core"
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/stable')
    runs-on: ubuntu-latest
    timeout-minutes: 45  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: write # push the image to GHCR (by digest, no tag)
    env:
      DOCKER_CLIENT_TIMEOUT: "120"
      COMPOSE_HTTP_TIMEOUT: "120"
      # The build action's clean-up step exported and uploaded a build record and summary, which
      # took 9 to 11 minutes per image on 11 Nov 2026 (run of b863a41). Nothing reads it; the
      # provenance and SBOM attestations are part of the image and stay.
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # ARC-32: the build never pushes with git
      - name: Optimize Runner Network (Disable IPv6 & Configure DNS)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
          sudo mkdir -p /etc/docker
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker logout || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Pre-pull BuildKit with retry
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i to pull BuildKit..."
            docker pull moby/buildkit:buildx-stable-1 && break || sleep 3
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: |
            network=host

      # the same metadata as publish below: the image labels (version) come from it
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # A version tag publishes :beta and the exact version; .github/workflows/promote.yml
            # moves :latest, :stable and MAJOR.MINOR to it after a 3-day soak (OPS-07)
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,format=short

      # Pushed by digest only: no tag points at it until the tests, smoke tests, scan and
      # signing pass (OPS-1)
      - name: Build and push Multi-Arch Docker image (by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # The next jobs read the digest from this small file
      - name: Hand the digest to the checks
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no image digest from the build"; exit 1;; esac
          echo "$DIGEST" > digest.txt
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}
          path: digest.txt
          retention-days: 3

  check-image:
    name: Check image (amd64, ${{ matrix.variant }})
    needs: [build-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: core
            suffix: "-core"
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_CLIENT_TIMEOUT: "120"
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Optimize Runner Network (Disable IPv6 & Configure DNS)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
          sudo mkdir -p /etc/docker
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker logout || true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.variant }}
      - name: Read the digest
        id: build
        run: |
          d=$(cat digest.txt)
          case "$d" in sha256:*) ;; *) echo "::error::bad digest file"; exit 1;; esac
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      # The image that will be published must start and serve the app (OPS-08).
      # It also must answer within 45 s of starting and stay within its download size (PERF-28, 29).
      # The core budget went from 340 to 345 MB on 30 Oct 2026 for gocryptfs (encrypted folders,
      # FEAT-13), which added 2 MB; raise it only with the reason here.
      - name: Smoke-test the built image (amd64, ${{ matrix.variant }})
        env:
          IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          STARTUP_BUDGET_SECS: "45"
          IMAGE_BUDGET_MB: ${{ matrix.variant == 'core' && '345' || '700' }}
        run: sh scripts/smoke_test.sh "$IMAGE" linux/amd64 18082 120

      # Release gate (OPS-06): no Critical vulnerability that already has a fix.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The action installs Trivy v0.70.0 unless told otherwise; Dependabot does not bump this
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # High findings are reported, not blocking, until each is triaged (OPS-13)
      - name: Report High vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # The update and rollback test in its own job, beside the smoke test and the scan (CI speed-up)
  update-test:
    name: Update and rollback test (${{ matrix.variant }})
    needs: [build-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: core
            suffix: "-core"
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_CLIENT_TIMEOUT: "120"
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Optimize Runner Network (Disable IPv6 & Configure DNS)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
          sudo mkdir -p /etc/docker
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker logout || true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.variant }}
      - name: Read the digest
        id: build
        run: |
          d=$(cat digest.txt)
          case "$d" in sha256:*) ;; *) echo "::error::bad digest file"; exit 1;; esac
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      # The real update path, end to end: Stable and the two newest releases, each on fresh data
      # with an account and a backup job made through its own API, updated to this build by its
      # own update helper (data must survive), then to an image that can't start (must roll
      # back). Blocking, and run before any tag is published, so a build that breaks updating or
      # rolling back never reaches edge/main (OPS-9, audit batch 1).
      # The three run at the same time, each with its own container names, port and data folder.
      - name: Upgrade and rollback test
        run: |
          NEW="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          docker pull -q "$NEW"
          docker pull -q busybox:1.37.0 >/dev/null
          RECENT=$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}" 'v*' \
            | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -2)
          i=0
          started=""
          for tag in latest $RECENT; do
            OLD="${{ env.OLD_IMAGE }}:$tag${{ matrix.suffix }}"  # core images end in -core (NARC-10)
            i=$((i + 1))
            # each run pulls its own old image, so the three downloads overlap too
            ( docker pull -q "$OLD" >/dev/null || exit 77
              KIBOTO_TEST_NAME="kb-upgrade-$i" KIBOTO_TEST_PORT=$((18090 + i)) \
                sh scripts/upgrade_rollback_test.sh "$OLD" "$NEW" ) > "/tmp/upgrade-$i.log" 2>&1 &
            started="$started $i:$!:$tag"
          done
          failed=""
          for run in $started; do
            n=${run%%:*}; rest=${run#*:}; pid=${rest%%:*}; tag=${rest#*:}
            rc=0; wait "$pid" || rc=$?
            if [ "$rc" = 0 ]; then status=passed
            elif [ "$rc" = 77 ]; then status="skipped (no image for $tag)"
            else status=FAILED; failed="$failed $tag"; fi
            echo "::group::from $tag ($status)"
            cat "/tmp/upgrade-$n.log"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=Upgrade and rollback test::failed from$failed, see the step log"
            exit 1
          fi

  # arm64 is built and published, so it must start too (OPS-10), here on a native arm64 runner
  # instead of under QEMU. The script runs the arm64 manifest by its own digest.
  smoke-arm64:
    name: Smoke-test image (arm64, ${{ matrix.variant }})
    needs: [build-image]
    strategy:
      fail-fast: false
      matrix:
        variant: [full, core]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.variant }}
      - name: Smoke-test the built image (arm64, ${{ matrix.variant }})
        run: |
          d=$(cat digest.txt)
          case "$d" in sha256:*) ;; *) echo "::error::bad digest file"; exit 1;; esac
          sh scripts/smoke_test.sh "${{ env.IMAGE }}@$d" linux/arm64 18083 180

  publish:
    name: Sign & publish image tags (${{ matrix.variant }})
    needs: [lint, lint-and-test, frontend, e2e-integration, still-latest, build-image, check-image, update-test, smoke-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: core
            suffix: "-core"
    if: github.event_name == 'push' && needs.still-latest.outputs.latest == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/stable')
    runs-on: ubuntu-latest
    timeout-minutes: 15  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: write # tag the image in GHCR
      id-token: write # keyless cosign signing (OIDC)
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Download the digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.variant }}
      - name: Read the digest
        id: build
        run: |
          d=$(cat digest.txt)
          case "$d" in sha256:*) ;; *) echo "::error::bad digest file"; exit 1;; esac
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # A version tag publishes :beta and the exact version; .github/workflows/promote.yml
            # moves :latest, :stable and MAJOR.MINOR to it after a 3-day soak (OPS-07)
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless signature bound to this workflow's identity; nothing to keep secret.
      - name: Sign image digest
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Publish tags for the verified digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # A build that finished after a newer commit landed must not move edge/main back
          moving_ok=1
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tip=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
            [ "$tip" = "${{ github.sha }}" ] || moving_ok=0
          fi
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$moving_ok" = 0 ] && [[ "$tag" != *":sha-"* ]]; then continue; fi
            args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${{ env.IMAGE }}@${DIGEST}"
          echo "Published ${#args[@]} tag argument(s) for ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          # the same tags under the old image name, and its own signature there (OLD_IMAGE)
          old_args=()
          for ((i = 1; i < ${#args[@]}; i += 2)); do old_args+=(-t "${OLD_IMAGE}${args[i]#"$IMAGE"}"); done
          docker buildx imagetools create "${old_args[@]}" "${IMAGE}@${DIGEST}"
          cosign sign --yes "${OLD_IMAGE}@${DIGEST}"
          echo "Also published and signed as ${OLD_IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify ${{ env.IMAGE }}@${DIGEST} --certificate-identity-regexp '^https://github\.com/fr0styx/(kiboto|zettnas-toolkit)/\.github/workflows/ci\.yml@refs/(heads/main|tags/v[0-9].*)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: GitHub Release & Release Notes
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # ARC-32: release notes and the release use the API, not git push
      - name: Extract Release Notes and Title from CHANGELOG.md
        id: extract_notes
        run: python3 scripts/extract_release_notes.py

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: ${{ steps.extract_notes.outputs.title }} (beta)
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          # Beta until the promote workflow publishes it as :latest after the 3-day soak (OPS-07)
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
