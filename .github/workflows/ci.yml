name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*", "stable" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: jobs read only; the build job and the release job ask for more below.
permissions:
  contents: read

# Pushes get one run per commit and are never cancelled, so every commit on main shows
# its own test result (cancelled jobs count as failed checks on GitHub). Pull requests
# still cancel superseded runs. Only the newest commit builds images: see still-latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  lint-and-test:
    name: Lint & Pytest Unit Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install httpx playwright

      - name: Run Ruff Lint
        run: ruff check app.py backend tests scripts

      - name: Pyright type check, no file may get worse (OPS-24)
        run: python scripts/pyright_ratchet.py

      - name: Silent except/pass may not grow (ARC-01)
        run: python scripts/silent_except.py

      - name: Run Ruff Format Check
        run: ruff format --check app.py backend tests scripts

      - name: Run Pytest Suite with Coverage
        # OPS-16: coverage may not drop below the floor (raise it as coverage grows)
        # Failing tests are also posted as an annotation, readable without log access
        run: |
          set -o pipefail
          if ! pytest --cov=backend --cov=app --cov-report=xml --cov-fail-under=66 -v -rfE 2>&1 | tee /tmp/zn-unit.log; then
            body=$( (grep -E '^(FAILED|ERROR)|^E  |Required test coverage|Coverage failure' /tmp/zn-unit.log | tail -n 40) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Unit tests::$body"
            exit 1
          fi

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest with Coverage)
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: First-load size budget (FE-01)
        run: npm run budget

      - name: Translation lint (FE-13)
        run: npm run lint:i18n

      - name: CSS budget (!important and button classes may only go down)
        run: npm run lint:css

      - name: ESLint (OPS-24)
        run: npm run lint:js

  e2e-integration:
    name: Headless Playwright E2E Integration
    needs: [lint-and-test, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Build frontend static distribution
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install httpx playwright
          python -m playwright install --with-deps chromium
          # Run Playwright on the patched Node.js from setup-node, not its bundled copy
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"

      - name: Launch Test Server & Run Playwright E2E Suite
        env:
          PORT: "8082"
          WEB_PASSWORD: "admin"
          DATA_DIR: "${{ github.workspace }}/data"
          # A browsable folder for the explorer and viewer accessibility checks (sample photos go here)
          POOL_PATH: "${{ github.workspace }}/e2e-pool"
          BROWSE_ROOTS: "${{ github.workspace }}/e2e-pool"
          ZETTNAS_E2E_MEDIA_DIR: "${{ github.workspace }}/e2e-pool"
        run: |
          mkdir -p "$ZETTNAS_E2E_MEDIA_DIR"
          annotate() {
            body=$( (echo "$2"; echo '--- server warnings ---'; grep -v 'Auth failed' /tmp/zn-server.log | grep -E 'WARNING|ERROR|CRITICAL|Traceback|Error' | tail -n 25; echo '--- server log ---'; tail -n 15 /tmp/zn-server.log) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::$body"
          }
          # Start background server
          python3 -m backend.main > /tmp/zn-server.log 2>&1 &
          SERVER_PID=$!

          # Poll health endpoint until server is ready
          python3 -c "
          import urllib.request, time
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8082/api/health', timeout=1) as r:
                      if r.status == 200:
                          print('ZettNAS test server is ready and responding on port 8082.')
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Timed out waiting for the test server.')
          " || { annotate 'E2E server' 'Test server did not become healthy'; exit 1; }

          # Execute full Playwright E2E Integration Suite; skips count as failures here
          set -o pipefail
          if ! ZETTNAS_E2E_REQUIRED=1 pytest tests/test_e2e_integration.py tests/test_e2e_a11y.py -v -rfE 2>&1 | tee /tmp/zn-e2e.log; then
            annotate 'E2E tests' "$(grep -E '^(FAILED|ERROR|E  )|Error|assert' /tmp/zn-e2e.log | tail -n 25)"
            exit 1
          fi

          # Shutdown background server cleanly
          kill $SERVER_PID || true

  # After the tests pass: is this commit still the tip of main? If not, a newer commit will
  # build and publish the images, so this one skips the build (skipped, not failed).
  still-latest:
    name: Still the latest commit?
    needs: [lint-and-test, frontend, e2e-integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - id: check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          tip=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "main has moved on to ${tip:0:7}; that commit builds the images." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-push:
    name: Build & Push Multi-Arch GHCR Container (${{ matrix.variant }})
    needs: [lint-and-test, frontend, e2e-integration, still-latest]
    # full: the default image. core: no VMs or LCD renderer, published as -core tags (OPS-11)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: core
            suffix: "-core"
    if: github.event_name == 'push' && needs.still-latest.outputs.latest == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/stable')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # keyless cosign signing (OIDC)
    env:
      DOCKER_CLIENT_TIMEOUT: "120"
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Optimize Runner Network (Disable IPv6 & Configure DNS)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
          sudo mkdir -p /etc/docker
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker logout || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Pre-pull BuildKit with retry
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i to pull BuildKit..."
            docker pull moby/buildkit:buildx-stable-1 && break || sleep 3
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # A version tag publishes :beta and the exact version; .github/workflows/promote.yml
            # moves :latest, :stable and MAJOR.MINOR to it after a 7-day soak (OPS-07)
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,format=short

      # Push under the commit tag only; the public tags are added after the scan and signature.
      - name: Build and push Multi-Arch Docker image (commit tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}${{ matrix.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # The image that will be published must start and serve the app (OPS-08).
      - name: Smoke-test the built image (amd64, ${{ matrix.variant }})
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          # Failures are reported as annotations (readable without log access).
          fail() {
            logs=$(docker logs zettnas-smoke 2>&1 | tail -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Smoke test::$1%0A--- container log (last 40 lines) ---%0A$logs"
            exit 1
          }
          docker run -d --name zettnas-smoke -p 18082:8082 -e PORT=8082 -e ENABLE_FB=0 "$IMAGE"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18082/api/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || fail "no healthy /api/health within 2 minutes"
          curl -fsS -o /tmp/index.html http://127.0.0.1:18082/ || fail "GET / failed"
          grep -qi "<html" /tmp/index.html || fail "index.html not served"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18082/api/users)
          [ "$code" = 401 ] || fail "/api/users without a session returned $code, expected 401"
          bad=$(docker logs zettnas-smoke 2>&1 | grep -E "Traceback|CRITICAL" | head -5 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          [ -z "$bad" ] || fail "errors in startup log: $bad"
          docker rm -f zettnas-smoke

      # Release gate (OPS-06): no Critical vulnerability that already has a fix.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The action installs Trivy v0.70.0 unless told otherwise; Dependabot does not bump this
          version: v0.76.1
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature bound to this workflow's identity; nothing to keep secret.
      - name: Sign image digest
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Publish tags for the verified digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # A build that finished after a newer commit landed must not move edge/main back
          moving_ok=1
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tip=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
            [ "$tip" = "${{ github.sha }}" ] || moving_ok=0
          fi
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$moving_ok" = 0 ] && [[ "$tag" != *":sha-"* ]]; then continue; fi
            args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/${{ github.repository }}@${DIGEST}"
          echo "Published ${#args[@]} tag argument(s) for ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify ghcr.io/${{ github.repository }}@${DIGEST} --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: GitHub Release & Release Notes
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Release Notes and Title from CHANGELOG.md
        id: extract_notes
        run: python3 scripts/extract_release_notes.py

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.extract_notes.outputs.title }} (beta)
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          # Beta until the promote workflow publishes it as :latest after the 7-day soak (OPS-07)
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
