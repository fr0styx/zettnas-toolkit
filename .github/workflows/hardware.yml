name: Hardware budgets

# Runs on the self-hosted runner next to a real ZettNAS server (docs/HARDWARE_RUNNER.md).
# Only on a schedule or by hand from main: never for pull requests, so code from a fork can
# never reach that machine. The log says PASS/FAIL/SKIP only; the numbers stay on the machine.
# Order: the idle budgets and the spin-down watch first (they need a quiet machine), the AI
# check last (it wakes the model servers).
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-budgets
  cancel-in-progress: false

jobs:
  budgets:
    if: github.repository == 'fr0styx/zettnas-toolkit' && github.ref == 'refs/heads/main'
    runs-on: [zettnas-hardware]  # the runner carries only this label (no default labels)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Budgets (5-minute soak)
        run: python3 scripts/hardware_budgets.py --seconds 300

  spindown:
    # Read-only: kernel counters only, never a command to a drive (PERF-2)
    needs: budgets
    if: always() && github.repository == 'fr0styx/zettnas-toolkit' && github.ref == 'refs/heads/main'
    runs-on: [zettnas-hardware]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Spin-down (30-minute watch)
        run: python3 scripts/hardware_spindown.py --minutes 30

  vector-bench:
    # The vector index at 100,000 and 1,000,000 synthetic chunks: p95 search time and recall of
    # int8 search with float rescoring (AI-18). A temporary database; no model, no array disk.
    needs: spindown
    if: always() && github.repository == 'fr0styx/zettnas-toolkit' && github.ref == 'refs/heads/main'
    runs-on: [zettnas-hardware]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Vector index at 100k and 1M chunks
        run: /opt/zn-eval/bin/python scripts/vector_bench.py --chunks 100000 1000000

  ai-eval:
    # Search and answers on the model servers this install uses, read-only (AI-16)
    needs: [spindown, vector-bench]
    if: always() && github.repository == 'fr0styx/zettnas-toolkit' && github.ref == 'refs/heads/main'
    runs-on: [zettnas-hardware]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: AI eval on the production model servers
        run: /opt/zn-eval/bin/python scripts/hardware_ai_eval.py
