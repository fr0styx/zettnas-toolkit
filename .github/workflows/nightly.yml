name: Nightly random order

# The unit suite in a shuffled order (ARC-13), to find tests that only pass because an
# earlier test left something behind. A failure prints the seed; re-run locally with
#   pytest --random-order=<seed>
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  random-order:
    name: Unit suite in random order
    if: github.repository == 'fr0styx/zettnas-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends restic

      - name: Pytest in random order
        run: pytest -q -rfE --random-order --deselect tests/test_e2e_integration.py
