# Runs the image smoke test on an already published image, e.g. to check arm64 after a fix
# without waiting for a full build. The same script gates every build in ci.yml.
name: Smoke test a published image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Tag or digest of ghcr.io/<repo> (edge, latest, sha-abc1234, sha256:...)"
        required: true
        default: edge
      platform:
        description: Platform to start
        type: choice
        options: [linux/arm64, linux/amd64]
        default: linux/arm64

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Smoke test
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          PLATFORM: ${{ inputs.platform }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          case "$IMAGE_INPUT" in
            sha256:*) ref="$REPO@$IMAGE_INPUT" ;;
            *[!A-Za-z0-9_.-]*) echo "::error::not a tag: $IMAGE_INPUT"; exit 1 ;;
            *) ref="$REPO:$IMAGE_INPUT" ;;
          esac
          sh scripts/smoke_test.sh "$ref" "$PLATFORM" 18083 600
