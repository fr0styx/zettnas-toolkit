# Private Cloud für die Familie
services:
  nextcloud:
    image: nextcloud:31-apache
    ports:
      - "8443:80"
    volumes:
      - nextcloud_data:/var/www/html
      - /mnt/user/familie/dokumente:/mnt/dokumente
    environment:
      - POSTGRES_HOST=db
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.familie-keller.de
    depends_on: [db]
  db:
    image: postgres:16
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  nextcloud_data:
  db_data:
