services:
  zettnas-toolkit:
    build: .
    image: ghcr.io/fr0styx/zettnas-toolkit:latest
    container_name: zettnas-toolkit
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8082]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/fr0styx/zettnas-toolkit/main/static/img/icon.png"
      net.unraid.docker.shell: "bash"
    ports:
      - "${PORT:-8082}:8082"
      - "${WEBDAV_PORT:-8084}:8084"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:rw
      - /dev:/host/dev:rw
      - /dev/fb0:/dev/fb0                                    # Physical LCD (optional - omit if headless)
      - /dev/dri:/dev/dri                                    # GPU acceleration (optional)
      - /dev/fuse:/dev/fuse:rw                               # FUSE cloud remotes mount
      - /etc/localtime:/etc/localtime:ro
      - ${STORAGE_POOL_PATH:-/mnt/user}:/mnt/user:rw
      - ./data:/app/data
      - /boot/config/network.cfg:/boot/config/network.cfg:ro # Unraid network config (optional on Linux)
      - /var/local/emhttp:/var/local/emhttp:ro               # Unraid array status (optional on Linux)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LCD_FPS=${LCD_FPS:-10}
      - PORT=8082
      - WEBDAV_PORT=${WEBDAV_PORT:-8084}
      - WEB_PASSWORD=${WEB_PASSWORD:-admin}
      - NAS_NAME=${NAS_NAME:-NAS}
      - POOL_PATH=/mnt/user
      - OS_NVME=${OS_NVME:-nvme1n1}
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_DEV=/host/dev
    tmpfs:
      - /host/sys/firmware:ro
      - /host/sys/kernel/debug:ro
    cap_add:
      - SYS_RAWIO   # Required for low-level SCSI/SATA SMART queries via SG_IO
      - SYS_ADMIN   # Required for NVMe ioctls (NVME_IOCTL_ADMIN_CMD) and camera media mount(2)/umount(2)
    device_cgroup_rules:
      - 'c 29:* rwm'    # Framebuffer (/dev/fb0)
      - 'c 226:* rwm'   # DRI / GPU rendering (/dev/dri/*)
      - 'c 188:* rwm'   # USB Serial (/dev/ttyUSB0)
      - 'c 166:* rwm'   # ACM Serial (/dev/ttyACM0)
      - 'b 8:* rwm'     # SCSI/SATA block devices (/dev/sd*)
      - 'b 259:* rwm'   # NVMe block devices (/dev/nvme*)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
