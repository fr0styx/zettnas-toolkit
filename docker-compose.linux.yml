version: "3.8"

# ==============================================================================
# Kiboto - Turnkey Generic Linux Deployment
# Supports Ubuntu, Debian, Alpine, Fedora, Arch, and Raspberry Pi OS (ARM64 & x86_64).
# Features Active Provisioner Mode (Btrfs RAID1/10) and line-rate Samba sidecar.
# ==============================================================================

services:
  zettnas-toolkit:
    image: ghcr.io/fr0styx/zettnas-toolkit:latest  # ghcr.io/fr0styx/kiboto gets :latest when 2.0.0 reaches stable; until then this name carries it
    container_name: kiboto
    networks:
      default:
        aliases: [zettnas-toolkit] # apps set up before the rebrand know this name (until 2.2)
    restart: unless-stopped
    stop_grace_period: 150s  # running virtual machines are asked to shut down first and get two minutes
    logging:  # keep container logs from filling the disk (OPS-13)
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8082:8082"   # Kiboto Workbench WebUI & REST API
      - "8084:8084"   # Universal WebDAV Engine (Direct Line-Rate Access)
    volumes:
      # Host telemetry and sysfs mounts
      - /proc:/host/proc:ro
      - /sys:/host/sys:rw
      - /dev:/host/dev:rw
      - /dev/fuse:/dev/fuse:rw
      - /etc/hostname:/host/etc/hostname:ro
      
      # Storage root with bidirectional mount propagation
      - ${STORAGE_POOL_PATH:-/mnt/storage}:/mnt/storage:rw
      - /mnt/user:/mnt/user:rw
      - /zettos:/zettos:rw
      - /var/local/emhttp:/var/local/emhttp:ro
      
      # Persistent application state and credentials
      - ./data:/app/data
      
      # Docker engine socket for container mutator and sidecar supervision
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PORT=8082
      - WEBDAV_PORT=8084
      - POOL_PATH=/mnt/storage
      - SAMBA_MODE=native_sidecar
      - PUID=1000
      - PGID=1000
      - ENABLE_FB=1
      - LCD_FPS=10
      - NAS_NAME=${NAS_NAME:-}
      - UPDATE_CHANNEL=${UPDATE_CHANNEL:-stable}
      - KIBOTO_OBSERVER_ADAPTER=${KIBOTO_OBSERVER_ADAPTER:-${ZETTNAS_OBSERVER_ADAPTER:-auto}}
      # Optional: encrypt the AI search index and chat history at rest (16+ characters).
      # Put it in the .env file next to this compose file (not in ./data) and in a password manager.
      - KIBOTO_DATA_KEY=${KIBOTO_DATA_KEY:-${ZETTNAS_DATA_KEY:-}}
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    device_cgroup_rules:
      - 'c 1:1 rwm'     # /dev/mem (Physical Memory-Mapped I/O for appliance fan and button control)
      - 'c 29:* rwm'    # Framebuffer (/dev/fb0)
      - 'c 226:* rwm'   # DRI / GPU rendering (/dev/dri/*)
      - 'c 188:* rwm'   # USB Serial (/dev/ttyUSB*)
      - 'c 166:* rwm'   # ACM Serial (/dev/ttyACM*)
      - 'c 189:* rwm'   # USB Character Devices & Bus (/dev/bus/usb/*)
      - 'c 180:* rwm'   # USB HID Devices (/dev/usb/hiddev*)
      - 'c 240:* rwm'   # HIDRAW Character Devices (/dev/hidraw*)
      - 'c 241:* rwm'   # HIDRAW Character Devices (/dev/hidraw*)
      - 'c 242:* rwm'   # HIDRAW Character Devices (/dev/hidraw*)
      - 'c 243:* rwm'   # HIDRAW Character Devices (/dev/hidraw*)
      - 'c 244:* rwm'   # HIDRAW Character Devices (/dev/hidraw*)
      - 'c 245:* rwm'   # HIDRAW Character Devices (/dev/hidraw*)
      - 'c 10:232 rwm'      # /dev/kvm (virtual machines)
      - 'c 10:238 rwm'      # /dev/vhost-net (VM networking)
      - 'c 10:200 rwm'      # /dev/net/tun (bridged VM networking)
      - 'c 10:196 rwm'      # /dev/vfio/vfio (device passthrough)
      - 'c 10:229 rwm'      # /dev/fuse
      - 'b 8:* rwm'     # SCSI/SATA block devices (/dev/sd*)
      - 'b 259:* rwm'   # NVMe block devices (/dev/nvme*)
      - 'b 9:* rwm'     # Linux Software RAID block devices (/dev/md*)
      - 'b 253:* rwm'   # Device-Mapper / LVM / Crypt block devices (/dev/dm-*)
      - 'b 252:* rwm'   # bcache block devices (/dev/bcache*)
      - 'b 7:* rwm'     # Loop devices (/dev/loop*)
    devices:
      - /dev/fuse:/dev/fuse
      # - /dev/kvm:/dev/kvm  # Uncomment for direct /dev/kvm access if host has hardware virtualization

  zettnas-samba:
    # Maintained Samba on Alpine (github.com/crazy-max/docker-samba); dperson/samba stopped at 2021.
    # Kiboto writes the whole smb.conf; this container only runs it.
    image: crazymax/samba:4.23.8
    container_name: kiboto-samba
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host                    # Line-rate 10GbE throughput + Windows (WSD) discovery
    volumes:
      - /mnt/storage:/mnt/storage:rw
      - ./data/samba:/etc/samba/kiboto:ro
      - ./data/samba/private:/var/lib/samba/private:rw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        CONF=/etc/samba/kiboto/smb.conf
        if [ -f /etc/samba/kiboto/disable_sidecar ] || nc -z 127.0.0.1 445 2>/dev/null; then
          echo "[Kiboto Samba] The host already serves SMB on port 445. Standby mode."
          while true; do sleep 86400; done
        fi
        until [ -f "$$CONF" ]; do
          echo "[Kiboto Samba] Waiting for Kiboto to write $$CONF..."
          sleep 5
        done
        mkdir -p /var/lib/samba/private /var/log/samba /run/samba
        # Unix accounts live only in this container: recreate them from Samba's user database
        pdbedit -L 2>/dev/null | while IFS=: read -r user uid _; do
          [ -n "$$user" ] && ! id -u "$$user" >/dev/null 2>&1 && { adduser -D -H -u "$$uid" "$$user" 2>/dev/null || adduser -D -H "$$user"; }
        done
        nmbd --daemon --configfile="$$CONF" || echo "[Kiboto Samba] nmbd did not start (NetBIOS names only)"
        wsdd2 -d -w || echo "[Kiboto Samba] wsdd2 did not start (Windows network discovery only)"
        exec smbd --foreground --no-process-group --debug-stdout --configfile="$$CONF"
    depends_on:
      - zettnas-toolkit
