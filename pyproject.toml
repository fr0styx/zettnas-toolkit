[project]
name = "zettnas-toolkit"
version = "1.9.2"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "exifread==3.5.1",
    "fastapi==0.146.0",
    "apprise>=2.0.1",
    "orjson>=3.13.0",
    "Pillow>=13.0.0",
    "playwright>=1.64.0",
    "PyYAML>=6.0.3",
    "argon2-cffi>=25.1.0",
    "sse-starlette==3.5.0",
    "uvicorn==0.54.0",
    "websockets>=17.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = ["real_confirmations: run the real destructive-action confirm flow"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E402", "F401", "F841", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "app"]
