[project]
name = "zettnas-toolkit"
version = "1.9.3"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "exifread==3.5.1",
    "fastapi==0.146.0",
    "apprise>=2.0.1",
    "orjson>=3.13.0",
    "ldap3>=2.9.1",
    "Pillow>=13.0.0",
    "playwright>=1.64.0",
    "PyYAML>=6.0.3",
    "argon2-cffi>=25.1.0",
    "sse-starlette==3.5.0",
    "uvicorn==0.54.0",
    "websockets>=17.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = ["real_confirmations: run the real destructive-action confirm flow"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# OPS-24: bugbear, pyupgrade, simplify and import order on top of the pyflakes/pycodestyle base
select = ["E", "W", "F", "B", "UP", "SIM", "I"]
ignore = [
    "E501", "E402", "F401", "F841", "F811",
    # style-only simplify rules this codebase doesn't follow
    "SIM102", "SIM105", "SIM108", "SIM117",
    # unsafe here: sqlite3.Row has keys() but no get(), and "in row" checks values, not columns
    "SIM118", "SIM401",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with these calls as defaults
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form",
    "fastapi.Header", "fastapi.Path", "fastapi.Cookie", "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "app"]
