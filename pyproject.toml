[project]
name = "zettnas-toolkit"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "exifread==3.0.0",
    "fastapi==0.115.0",
    "Pillow>=10.4.0",
    "playwright>=1.47.0",
    "sse-starlette==2.1.3",
    "uvicorn==0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "EXE002", # file is executable but no shebang (common on SMB/Windows mounts)
    "E501",   # line length violations handled by formatter / sensible manual breaks
    "B008",   # do not perform function calls in argument defaults (standard in FastAPI Depends)
    "B904",   # within an `except` clause, raise exceptions with from
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "app"]
