[project]
name = "zettnas-toolkit"
version = "1.3.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "exifread==3.0.0",
    "fastapi==0.142.2",
    "apprise>=1.9.0",
    "Pillow>=10.4.0",
    "playwright>=1.47.0",
    "sse-starlette==2.1.3",
    "uvicorn==0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E402", "F401", "F841", "F811", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "app"]
