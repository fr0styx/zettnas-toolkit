[project]
name = "zettnas-toolkit"
version = "1.6.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "exifread==3.5.1",
    "fastapi==0.142.2",
    "apprise>=1.9.0",
    "Pillow>=12.3.0",
    "playwright>=1.63.0",
    "PyYAML>=6.0.1",
    "argon2-cffi>=23.1.0",
    "sse-starlette==3.5.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E402", "F401", "F841", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "app"]
